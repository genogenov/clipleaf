name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    timeout-minutes: 15 # backstop: tests have no timeouts of their own, a hang must not run for hours
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --release --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release

  cross-check:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target:
          - i686-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - powerpc64le-unknown-linux-gnu
          - s390x-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - loongarch64-unknown-linux-gnu
          - sparc64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal -c clippy -t ${{ matrix.target }} && rustup default stable
      - run: cargo clippy --workspace --target ${{ matrix.target }} --all-targets -- -D warnings