[package]
name = "clipleaf-test-common"
version.workspace = true
edition.workspace = true
publish = false

# Dev-only: used as a [dev-dependencies] entry, never shipped.
# Pure-Rust wayland backend: do not enable `system` or `log` (they need C and pkg-config).
[dependencies]
wayland-server = "0.31.7"
wayland-protocols = { version = "0.32.6", features = ["server", "staging"] }
rustix = { version = "1", default-features = false, features = ["std", "net", "event", "fs", "pipe", "process", "pty"] }
